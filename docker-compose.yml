version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tiza-postgres
    environment:
      POSTGRES_USER: tiza_user
      POSTGRES_PASSWORD: tiza_password
      POSTGRES_DB: tiza_dev
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tiza_user -d tiza_dev']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tiza-redis
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── S3 Simulation (MinIO) ──────────────────────────────────────────
  # ponytail: MinIO over LocalStack — lightweight, S3-compatible API,
  # same boto3 SDK. Migrate to AWS S3 by changing STORAGE_BACKEND env var.
  minio:
    image: minio/minio:latest
    container_name: tiza-minio
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # Web Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
    command: server /data --console-address ':9001'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Email Simulation (Mailpit) ─────────────────────────────────────
  # ponytail: Mailpit over MailHog — active maintenance, REST API,
  # HTML preview, spam score. Production: switch EMAIL_BACKEND to "ses".
  mailpit:
    image: axllent/mailpit:latest
    container_name: tiza-mailpit
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 'true'
    volumes:
      - mailpitdata:/data
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:8025']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── MinIO Bucket Initializer ──────────────────────────────────────
  # Creates required buckets on first startup
  minio-init:
    image: minio/mc:latest
    container_name: tiza-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/tiza-evaluations;
      mc mb --ignore-existing local/tiza-reports;
      mc mb --ignore-existing local/tiza-crops;
      echo '✅ MinIO buckets created';
      exit 0;
      "

volumes:
  pgdata:
  redisdata:
  miniodata:
  mailpitdata:
