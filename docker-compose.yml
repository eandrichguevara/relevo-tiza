version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tiza-postgres
    environment:
      POSTGRES_USER: tiza_user
      POSTGRES_PASSWORD: tiza_password
      POSTGRES_DB: tiza_dev
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tiza_user -d tiza_dev']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tiza-redis
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
